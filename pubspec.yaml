  ffi: ^2.1.0  
  native_opencv:
    path: ./PLUGINS/native_opencv


  # opencv_ffi: 1.1.0
  # fps_widget: 1.0.1+2
  # tflite_flutter: 0.10.2
  #native
  winaudio:
    path: ./PLUGINS/winaudio
