dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

  flutter_lints: ^2.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/icons/SpikerbotAppIcon.appiconset/1024-mac.png"
  image_path: "assets/icons/SpikerbotLogo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/SpikerbotLogo.png"
    background_color: "#hex_code"
    theme_color: "#hex_code"
  windows:
    generate: true
    image_path: "assets/icons/SpikerbotLogo.png"
    icon_size: 48 # min:48, max:256, default: 48
  
dependency_overrides:
  http: ^1.1.0
  web: ^1.0.0
flutter:
  fonts:
    - family: BybHanddrawn
      fonts:
      - asset: assets/fonts/BYBHandDrawn.otf
    - family: NotoEmoji
      fonts:
      - asset: assets/fonts/NotoEmoji-VariableFont_wght.ttf
  assets:
    - assets/icons/
    - assets/bg/
    - assets/bg/BrainDrawings/
    - assets/models/
    - assets/saved/
    - assets/audio/
  uses-material-design: true
